<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Inspektor robot{% endblock %}</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1f2933; --muted:#6b7785; --line:#e3e8ee;
          --blue:#1e88e5; --green:#2e9d4f; --red:#d64545; --amber:#c98a00; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { background:#5fa8dc; color:#fff; padding:12px 24px; display:flex; gap:24px; align-items:center; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header .mode { margin-left:auto; padding:3px 10px; border-radius:12px; background:rgba(0,0,0,.18); font-size:12px; }
  header .mode.live { background:var(--red); }
  main { max-width:1300px; margin:20px auto; padding:0 16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .card .n { font-size:26px; font-weight:700; }
  .card .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { background:#f8fafc; font-size:12px; color:var(--muted); text-transform:uppercase; }
  tr:hover td { background:#fafcff; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; color:#fff; }
  .ACCEPT { background:var(--green); } .REJECT { background:var(--red); } .MANUAL { background:var(--amber); }
  .ERROR { color:var(--red); font-weight:600; } .WARNING { color:var(--amber); font-weight:600; } .INFO { color:var(--muted); }
  form.filters { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--blue); color:#fff; border-color:var(--blue); cursor:pointer; }
  pre { white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line); padding:12px; border-radius:6px; }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns:1fr; } }
  .muted { color:var(--muted); }
  a { color:var(--blue); }
</style>
</head>
<body>
<header>
  <a href="/">Hisobotlar</a>
  <a href="/runs">Ishga tushirishlar</a>
  <span class="mode {{ 'live' if mode == 'live' else '' }}">Rejim: {{ mode }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
